# SlotEase nginx: serves the SPA and proxies /api/ + /health to the backend.
# Included inside the http {} block (conf.d/default.conf), so map/resolver are valid here.

# Cache policy per URI (empty value = header not added, e.g. for API responses).
map $uri $slotease_cache_control {
    default            "";
    ~^/assets/         "public, max-age=31536000, immutable";
    /index.html        "no-cache";
}

# Keep https when an upstream proxy (Caddy) already terminated TLS.
map $http_x_forwarded_proto $slotease_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # Real client IP: trust X-Forwarded-For only from private/Docker networks (Caddy in prod).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Docker's embedded DNS; re-resolve the backend so restarts with new IPs keep working.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $slotease_backend http://backend:8000;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml application/manifest+json font/ttf font/otf;

    # Security headers (always = also on 4xx/5xx). Keep CSP in sync with third parties used by the SPA:
    # Google Fonts (fonts.googleapis.com / fonts.gstatic.com) and Razorpay Checkout.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://*.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.razorpay.com https://*.razorpay.com; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://*.razorpay.com; form-action 'self' https://*.razorpay.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://checkout.razorpay.com\" \"https://api.razorpay.com\")" always;
    add_header Cache-Control $slotease_cache_control;

    # ---------- API + health -> backend (path preserved) ----------
    location /api/ {
        proxy_pass $slotease_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # $remote_addr is the real client after real_ip processing; overwrite to prevent spoofing.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $slotease_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # The API sets these itself; nginx adds them for every response, so avoid duplicates.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }

    location = /health {
        proxy_pass $slotease_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # $remote_addr is the real client after real_ip processing; overwrite to prevent spoofing.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $slotease_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # The API sets these itself; nginx adds them for every response, so avoid duplicates.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }

    # ---------- Static ----------
    # Hashed build assets: cache for a year.
    location /assets/ {
        try_files $uri =404;
        access_log off;
    }

    # SPA shell: never cached so new deploys are picked up immediately.
    location = /index.html {
        try_files $uri =404;
    }

    # Client-side routes fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
